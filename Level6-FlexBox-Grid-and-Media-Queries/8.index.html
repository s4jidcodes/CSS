<!DOCTYPE html>
<html lang="en">
<head>

    <title>media Queries</title>
    <style>
        .box{
            padding: 5px;
            height: 100px;
            width: 100px;
            background-color: aqua;
        }
        @media screen and (width: 300px){     /*means here screen resize karenge 300px par box color brown hogi*/
            .box{
                background: brown;
            }

        }
    </style>
</head>
<body>
    <div class="box">Box</div>
</body>
</html>
