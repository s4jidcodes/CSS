<!DOCTYPE html>
<html lang="en">
    <!--Testing color property part 2 css likhna head ke andar <style> tag mai  -->
<head>|
    <title>Color Property</title>
    <style>
        /* style k andar text colur kare hai like kahi ka bhi paragraph ko bhi yahi se color kar sakte hai. aur humne alphabet ko color kiya called foreground color and page back ko color called background*/
        h1 {
            color: rgb(134, 171, 0);
        }
        p {
            color: brown;
        }

/* comment css mai aisa tag rahega remember & here h1 is the selector. color is the property  color. and name box wala wo value. hai hoga color ka part-1 html likhna <body> tag mai ye without link hai html and css ek sath */
    </style>
   
    
</head>
<body>
    <h1>This is foreground color </h1>
    <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Officia, soluta. &</p>
</body>
</html>
