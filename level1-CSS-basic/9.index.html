<head>

    <style>
        /* for example here (8.index.html) ka syntax uthaya aur group kar diya by (,) aur sabhi ke same color  */
#first_heading, .random_text {
    color: blueviolet;
}

    <!--just(.) dotclasssajid and div k sath generated  -->

    <h1 class="random text">This is the last heading</h1>
