<!-- Meaningg:
External styling ka matlab hota hai
CSS ko ek ALAG .css file me likhna -->

<!-- Ye CSS multiple HTML pages pe apply ho sakti hai -->

<!-- STEP 1: HTML FILE (index.html)
 a. head ke andar link
 b. then body likho
 c css mai style likho -->


<!DOCTYPE html>
<html lang="en">
<head>
    <title>External CSS</title>

    <!-- CSS file ko HTML se connect karro dono alag alag likh kar -->
    <!-- link tag hamesha <head> ke andar hota hai -->

    <link rel="stylesheet" href="4.index.css">
</head>
<body>

    <h1>External Styling Example</h1>
    <p>this paragraph is styled by external csss.</p>

</body>
</html>
<!-- ab new 4.index.html CSS ka info hai  -->
