<!DOCTYPE html>
<html lang="en">
<head>

    <title>Class Selector</title>
    <style>
#first_heading {
    color: blueviolet;
}
.random_text{
    color: rgb(165, 42, 144);
}

    <h1 class="random text">This is the last heading</h1>
</body>
</html>
