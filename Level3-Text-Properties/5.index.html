<!DOCTYPE html>
<html lang="en">
<head>
    <!--Text-Transform property-->
   <!--synatx: text-transform: uppercase;-->
    <!--text-transform CSS property text ke letters ka case control karti hai.

Points:
1.uppercase → sab letters CAPITAL
2.lowercase → sab letters small
3.capitalize → har word ka pehla letter CAPITAL
4.none → text me koi change nahi
5.Typography improve karne ke liye use hoti hai

oneline :
text-transform = letters CAPITAL ya small banana-->
 <!--synatx: text-transform: uppercase;-->
    <title>Text transform property</title>
    <style>
#box1{text-transform: uppercase;}
#box2{text-transform: lowercase;}
#box3{text-transform: capitalize;}
#box4{text-transform: none;}
    </style>
</head>
<body>
    <h2 id="box1">first box</h2>
    <h1 id="box2">Second box</h1>
    <h1 id="box3">third box</h1>
    <h1 id="box4">fourth box</h1>

    due to here ham height , underline, sabke kuch coomon nhi assume kiya (.clas{},.div{{})liye nhi define kiya hai whenever common define hoga class use hoga-->
</body>
</html>
