<!DOCTYPE html>
<html lang="en">
<head>
    <!--font property (font style)-->
    <!--font-style CSS property text ka style control karti hai, mainly text ko seedha ya tedha banane ke liye.

Points:
normal → seedha text
italic → tedha text
oblique → thoda sa tedha text
Text highlight ya different dikhane ke liye use hoti hai-->

<!--synatx: --font-style-->
<title>font style </title>
    <style>
#sailor1{font-style: oblique;font-size: x-large;}
#sailor2{font-style: normal;}
#sailor3{font-style: italic;}
    </style>
</head>
<body>
     <p id="sailor1">Lorem ipsum dolor sit amet, consectetur adipisicing elit. Consequuntur, rem.</p>
    <p id="sailor2">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Impedit, ab.</p>
    <p id="sailor3">Lorem ipsum dolor sit amet consectetur adipisicing elit. Deleniti, illum.</p>
</body>
</html>
