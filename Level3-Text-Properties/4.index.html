<!DOCTYPE html>
<html lang="en">
<head>
    <!--Text-Decoration Property (color)-->
    <!--text-decoration-color text ke neeche/uper jo line hoti hai uska color set karti hai.

Points:
1.Ye underline, overline, line-through ka color change karti hai
2.Pehle text-decoration dena zaroori hota hai
3."Ye sirf decoration line par apply hoti hai," "text par nahi"
4.Normal color se alag property hai-->

    <title>Decoration color</title>
    <style>
        .box{text-decoration: underline}
        #box1{text-decoration-color: cornflowerblue;}
#box2{text-decoration-style: dotted;text-decoration-color: chartreuse;}
#box3{text-decoration-style: wavy;text-decoration-color: crimson;}
#box4{text-decoration-style: double;text-decoration-color: rgb(2, 2, 244);}
    </style>
</head>
<body>
     <caption> learn to decorate text <span style="color: rgb(242, 3, 35);">Color </span>inline overline dotted<caption>
     <h2 id="box1" class="box">box1</h2>
    <h1 id="box2" class="box">box2</h1>
    <h1 id="box3" class="box">box3</h1>
    <h1 id="box4" class="box">box4</h1>
</body>
</html>
