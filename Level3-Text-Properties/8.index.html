<!DOCTYPE html>
<html lang="en">
<head>
     <!--font property (font weight)-->
     <!--
font-weight CSS property text ki  (thickness) control karti hai.

Points:
1.Text ko normal ya bold banane ke liye use hoti hai
2.normal aur bold sabse common values hain
3.Numbers 100 se 900 tak hote hain
4.Zyada number = zyada bold text
5.Important text highlight karne me madad karti hai-->
<!--synatx : font-weight-->

    <title>font weight</title>
    <style>
#sailor1{font-weight: 100;}
#sailor2{font-weight: 400;}
#sailor3{font-weight: 900;background-color: blue;}
    </style>
</head>
<body>
    <p id="sailor1">Lorem ipsum dolor sit amet, consectetur adipisicing elit. Consequuntur, rem.</p>
    <p id="sailor2">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Impedit, ab.</p>
    <p id="sailor3">Lorem ipsum dolor sit amet consectetur adipisicing elit. Deleniti, illum.</p>
</body>
</html>
