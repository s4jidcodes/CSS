<!DOCTYPE html>
<html lang="en">
<head>
   <!--Line height (line ke beech ka gap)-->
   <!--synatx: line-height:px -->
   <!--line-height CSS property text ki lines ke beech ka 'vertical gap' set karti hai.

Points:
1.Lines ke upar aur neeche ka space control karti hai
2.Zyada line-height se text easy to read hota hai
3.Kam line-height se text chipka hua lagta hai
-->
<!--synatx: line-height:px -->
    <title>Line height</title>
    <style>
#sajid1{line-height: 6px;}
#sajid2{line-height: 30px;}
    </style>
</head>
<body>
    <p id="sajid1">Lorem ipsum dolor sit amet consectetur adipisicing elit. Blanditiis eaque fugiat voluptatem hic ullam ab qui architecto nobis harum sit.</p><hr><hr>
    <p id="sajid2">Lorem ipsum, dolor sit amet consectetur adipisicing elit. Autem incidunt aut hic praesentium neque provident explicabo reiciendis commodi, dolorum possimus!</p>
