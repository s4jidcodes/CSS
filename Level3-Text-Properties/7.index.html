<!DOCTYPE html>
<html lang="en">
<head>
    <!--font property (font size)-->
    <!--/* synatx:  font-size = text ka size */-->
   <!--font-size CSS property text ka size set karti hai.

Points:
1.Text chhota ya bada karne ke liye use hoti hai
2.px fixed size deta hai
3.Sahi font-size se readability improve hoti hai
4.Responsive design ke liye rem zyada better hota hai-->
    <title>font size</title>
    <style>
        #sajid1{font-size:x-large;}
        #sajid2{font-size: 20px;}
        #sajid3{font-size: 34px;}
    </style>
</head>
<body>
     <p id="sajid1">Lorem ipsum dolor sit amet consectetur adipisicing elit. Dicta, et..</p><hr><hr>
    <p id="sajid2">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Error, nobis.</p><hr>
    <p id="sajid3">Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptatibus, aperiam.</p>
</body>
</html>
