<!DOCTYPE html>
<html lang="en">
<head>
   <!--Syntax
text-decoration-style: value;-->

<!-- Points

1.text-decoration-style akela kaam nahi karta
2.Pehle underline / overline / line-through hona chahiye
3.Mostly design & styling ke liye use hota hai

Yaad: 

solid → simple
double → do line
dotted → dots
dashed → toot-ti line
wavy → wave

Conclusion
text-decoration-style text decoration ki line ka design decide karta hai jaise solid, dotted, dashed ya wavy, jisse text zyada attractive dikhta hai.-->
    <title>text decoration (style)</title>
    <style>
        .box{text-decoration: underline}
        #box1{text-decoration-style: dashed;}
#box2{text-decoration-style: dotted;}
#box3{text-decoration-style: wavy;}
#box4{text-decoration-style: double;}
    </style>
</head>
<body>
    <caption> learn to decorate text style </style></caption>
     <h1 id="box1" class="box">box1</h1>
    <h3 id="box2" class="box">box2</h3>
    <h3 id="box3" class="box">box3</h3>
    <h1 id="box4" class="box">box4</h1>
</body>
</html>
