<!DOCTYPE html>
<html lang="en">
<head>
    <!---Text align property

    text-align → text ke liye
margin: auto → box ke liye

  :Summary:
text-align text ko left, right, center ya justify karne ke kaam aata hai, "box ko move nahi karta", sirf text ko align karta hai. and only horizonatl hi align karta hai na ki in  vertical
Syntax
text-align: value;-->


    <title>text align property</title>
<style>
    .shah{ height: 100px; width: 100px;}
    #shah1{ background-color: red; text-align: center;}
    #shah2{background-color:green;text-align: left;}
    #shah3{background-color: blue;text-align: right;}
</style>
</head>
<body>
    <h3 id="shah1" class="shah">box1</h3>
    <h3 id="shah2" class="shah">box2</h3>
    <h3 id="shah3" class="shah">box3</h3>
</body>
</html>
