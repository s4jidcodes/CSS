<!DOCTYPE html>
<html lang="en">
<head>
    
    <title> Website</title>
</head>
<body>

    <!-- Header Start -->
    <header>

        <!-- Logo Section -->
        <div class="logo">Logo</div>

        <!-- Navigation Menu -->
        <nav>
            Navbar
        </nav>

        <!-- Search Bar -->
        <div class="search">
            Search
        </div>

        <!-- User Actions -->
        <div class="user-actions">
            Profile | Wishlist | Bag
        </div>

    </header>
    <!-- Header End -->


    <!-- Main Start -->
    <main>

        <!-- Banner Section -->
        <section class="banner">
            Banner
        </section>

        <!-- Categories Section -->
        <section class="categories">
            Categories
        </section>

        <!-- Products Section -->
        <section class="products">
            Products
        </section>

        <!-- Offers Section -->
        <section class="offers">
            Offers
        </section>

    </main>
    <!-- Main End -->


    <!-- Footer Start -->
    <footer>

        <!-- Important Links -->
        <div class="links">
            Links
        </div>

        <!-- Policies -->
        <div class="policies">
            Policies
        </div>

        <!-- Copyright -->
        <div class="copyright">
            © 2026 Myntra Clone
        </div>

    </footer>
    <!-- Footer End -->

</body>
</html>

<!--Myntra Clone
│
├── Header

├── Main

│   ├── Categories
│   ├── Products
│   └── Offers
│
└── Footer
    ├── Links
    ├── Policies
