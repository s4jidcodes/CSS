<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Transform (rotate)</title>
</head>
<style>
    .box{
height: 100px;
width: 100px;
border: 2px solid black;
border-radius: 6px;
background-color: plum;
position: relative;
top: 50px;
left:50px;
 transform: rotate(0deg); 
transition: all 2s ease-in; /*shorthand mai likha*/
}
 
 #box1:hover{
transform: rotate(45deg); 
 }
/*ye by default z axis mai rotate ho raha hai
rotetex (piche ki taraf rotate hota dikhega ) , rotatey(y axis k hisab se rotate hota dikhega ) kar sakte ho*/
 
#box2:hover{
transform: rotatex(45deg);
background-color: aqua; 
 }
 #box3:hover{
    transform: rotateY(45deg);
 }
 
</style>
<body>
    <div class="box" id="box1">Rotate 45deg</div>
    <div class="box" id="box2">Rotatex</div>
    <div class="box" id="box3">Rotatey</div>
</body>
</html>
