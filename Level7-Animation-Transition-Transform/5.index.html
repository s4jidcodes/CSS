<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Transform(Translate)</title>
</head>
<style>
    .box{
height: 100px;
width: 100px;
border: 2px solid black;
border-radius: 6px;
position: relative;
top: 50px;
left:50px;
 transform: rotate(0deg); 
transition: all 1s ease-out; /*shorthand mai likha*/
}
 
 #box1{
    background-color: rgb(65, 234, 65);
 }
#box1:hover{
transform: translate(50px,20px); /*x,y*/
 }

 #box2{
    background-color: rgb(68, 68, 243);
 }
#box2:hover{
transform: translateX(50px);}

#box3{
    background-color: rgb(221, 54, 54);}
 
 #box3:hover{
    transform: translateY(-50px);}
 
</style>
<body>
    <div class="box" id="box1">translate(x,y)</div>
    <div class="box" id="box2">translateX</div>
    <div class="box" id="box3">translate(-Y)</div>
</body>
</html>
