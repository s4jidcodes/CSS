<!DOCTYPE html>
<html lang="en">
<head>

    <title>Pseudo Classes</title>
<style>
    .pseudo{
height: 25px;
width: 150px;
background-color: aquamarine;
border: 2px solid black;
border-radius: 10px;
    }
    .pseudo:hover{
height: 30px;
width: 160px;
background-color: rgb(30, 159, 159);
    }
    .pseudo:active{
        height: 30px;
        width: 200px;
        background-color: chartreuse;
    }/*higest priorty active ki hogi means click karne par active ka css final hoga*/
</style>
</head>
<body>
    <button class="pseudo">Learning Pseudo</button>
</body>
</html>
