<!DOCTYPE html>
<html lang="en">
<head>

    <title>Transition</title>
    <!--Taken previous code-->
<style>
    .pseudo{
height: 25px;
width: 150px;
background-color: aquamarine;
border: 2px solid black;
border-radius: 10px;

transition-property: all;
transition-duration: 1s;
transition-timing-function: steps(3);
/*transition 3 step k baad hoga & more explore karna hai MDN jao */

transition-delay: 0s;

/*transition: all 1s ease-in-out 1s; (ek line mai likh sakte hai */
    }
    .pseudo:hover{
height: 30px;
width: 160px;
background-color: rgb(30, 159, 159);
    }
    .pseudo:active{
        height: 30px;
        width: 200px;
        background-color: chartreuse;
    }/*higest priorty active ki hogi means click karne par active ka css final hoga*/
</style>
</head>
<body>
    <button class="pseudo">Learning Pseudo</button>
</body>
</html>
