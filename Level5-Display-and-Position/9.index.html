<!DOCTYPE html>
<html lang="en">
<head>
   <title>Position property</title>
   <style>
    *{margin: 0; padding: 0;}
    div{
        height: 70px;
        width: 70px;
        background-color: rgb(144, 12, 244);
        border: 5px solid black;
        margin: 20px;
    }
    
    #div1{
        position: static;
    }
    #div2{
        position: relative;
        top: 60px;/*relative (apne postions se 20px move)*/
        left: 90px;/*apne position se 90px left move*/
    }
    /*#div3{
        position: fixed;
        /*top: 20px;/*fixed(apne postions se 20px )*/
        left: 60px;/* (apne postions se 60px )*/
        visibility: hidden;
    }
    #div4{
        position: absolute;
        top: 100px;/*absolute (apne postions se(page corner se left to top) page k according now top 200px )*/
        left: 100px;
    }
   </style>
</head> 
<body>
    <div id="div1">1 static</div>
    <div id="div2">2 Relative</div>
    <div id="div3">3 Fixed</div>
    <div id="div4">4 Absolute</div>
    <div id="box5">box5</div>
    <div id="box6">box6</div>
    <div id="box7">box7</div>
    <div id="box8">box8</div>
    
    
    

</body>
</html>
