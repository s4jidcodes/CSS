<!DOCTYPE html>
<html lang="en">
<head>
<!--Display and position-->
    <title>Display property(block)</title>
    <!--display: block element new line se start hota hai (here koi change nhi aya due to by default hota hai)-->
    <style>
*{
    margin: 0px; padding: 0px;
}
.box{
    height: 100px;
    width:100px;
    margin: 5px;
    background-color: springgreen;

    display: block;

}
    </style>
</head>
<body>
    <div id="box1" class="box"> Box 1</div>
    <div id="Box2" class="box">Box 2</div>
</body>
</html>
