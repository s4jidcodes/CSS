<!DOCTYPE html>
<html lang="en">
<head>
<!--Display Property (inline-block)

1.inline-block inline + block ka combination hai
2.Ye elements same line me rehte hai
3.Width aur height proper set hoti hai
4.Margin aur padding fully kaam karta hai
5.Layout banane me buttons, cards ke liye useful-->

    <title>Diplay property(inline-block)</title>
    <style>
        *{
    margin: 0px; padding: 0px;
}
.box{
    height: 100px;
    width:100px;
    margin: 5px;
    background-color: springgreen;

    display: inline-block; /*inline-block element text ke saath same line me rehta hai and (inline-box) can set size ) is wajah se 100px dene par (size + inlne) set hui*/

}
    </style>
</head>
<body>
    <div id="box1" class="box"> Box 1</div>
    <div id="Box2" class="box">Box 2</div>
</body>
</html>
