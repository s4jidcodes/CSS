<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Display property(Inline)</title>
    
    <style>
        *{
    margin: 0px; padding: 0px;
}
.box{
    height: 100px;
    width:100px;
    margin: 5px;
    background-color: springgreen;

    display: inline; /*inline element text ke saath same line me rehta hai and (inline can't set size h) is wajah se 100px dene par bhi faraq nhi pada height and width*/

}
    </style>
</head>
<body>
    <div id="box1" class="box"> Box 1</div>
    <div id="Box2" class="box">Box 2</div>
</body>
</html>
