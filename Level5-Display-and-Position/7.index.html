<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>Relative units(rem)</title>
    <!--rem root element (html) ke font-size par depend karta hai-->
    <style>
        *{margin: 0; padding: 0;
        font-size: 30px;}
       /* here body size is 10px i.e is root element here (sabse ooper likha hua )*/

#first{
    height: 200px; width: 200px;
    background-color: darkslategrey;
    font-size: 10px;} /*rem (no change on parent)*/
    #second{
        background-color: gold;
        width: 70%;
        height: 50%;
        font-size: 1rem; /*rem means here same- font as root font.i.e is body(10px). and if want double of root than 2rem */
    }
    </style>
</head>
<body>
    body 
    <div id="first">first
        <div id="second">second</div>
    </div><!--div k andar div-->
</body>
</html>
