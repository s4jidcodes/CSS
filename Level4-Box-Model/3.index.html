<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>border property</title>
    <style>
        *{
            margin: 0; padding: 0;
        }
        .pad{
            height: 50px;
            width: 50px;
            padding: 2px;
            margin: 5px;
        }
        #first{
            border: 6px solid;
            background-color: olivedrab;
        }
        #second{border: 5px dotted red; /* here color define hoga red ( directly no color \background color nhi likhan synatx and(;) se pahile color define  likhna)*/
            background-color: navajowhite;
        }
    </style>
</head>
<body>
    <div id="first" class="pad">first</div>
   <div id="second" class="pad">second</div> 
</body>
</html>
