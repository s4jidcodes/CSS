<!DOCTYPE html>
<html lang="en">
<head>

    <title>padding</title>
    <style>

    /*margin: 0 and padding: 0 are used to remove default browser spacing so that the layout starts from the top and can be fully controlled by the developer.*/
    *{
        margin: 0;
        padding: 0;
    }
    #padding {
        height: 50px;
        width: 50px;
        padding: 5px 5px 5px 5px;
        background-color: rgb(23, 193, 168);
    }
    </style>
</head>
<body>
    <div id="padding">padding checker</div>
</body>
</html>
