<!DOCTYPE html>
<html lang="en">
<head>

    <title>padding property</title>
    <style>

    /*margin: 0 and padding: 0 are used to remove default browser spacing so that the layout starts from the "top" and can be fully controlled by the developer.(universal selector)*/
    *{
        margin: 0;
        padding: 0;
    }
    #padded {
        padding: 10px;/* 4 baar means padding (1.top 2.right 3.bottom 4.left) mai define hai isse order mai and if 1 baar 10px likha than wo 4 side 10px by default lag jayega */
        background-color: rgb(23, 193, 168);
    }
    </style>
</head>
<body>
    <div id="padded">padding checker</div>
</body>
</html>
