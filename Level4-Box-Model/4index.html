<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>border (radius)</title>
    <style>
       *{
            margin: 0; padding: 0;
        }
        .pad{
            height: 50px;
            width: 50px;
            padding: 2px;
            margin: 5px;
        }
        #first{
            border: 6px solid;
            /*Note: border ke niche line mai border radius*/
            border-radius: 5px;
            background-color: olivedrab;
        }
        #second{border: 5px dotted red;
            border-radius: 50%;
            background-color: navajowhite;
        } 
    </style>
</head>
<body>
     <div id="first" class="pad">first</div>
   <div id="second" class="pad">second</div> 
</body>
</html>
